[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "signate_studentcup_2025"
version = "0.0.1"
description = "https://user.competition.signate.jp/ja/competition/detail/?competition=385dcbba17b645f3ac10f827dfba03f6"
authors = [
  { name = "argo" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "faiss-cpu>=1.13.2",
    "loguru",
    "matplotlib>=3.8.0",
    "mkdocs",
    "numpy>=2.2.6",
    "openai>=2.16.0",
    "pandas>=2.1.0",
    "pip",
    "polars>=1.37.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "ruff",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "tqdm",
    "typer",
    "umap-learn>=0.5.5",
    "wandb>=0.18.0",
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["signate_studentcup_2025"]
include = ["pyproject.toml", "signate_studentcup_2025/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["signate_studentcup_2025"]
force-sort-within-sections = true

[tool.uv.workspace]
members = ["git"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]


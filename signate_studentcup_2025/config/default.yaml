# Wandb設定
wandb:
  entity: argo-lab  # チーム名
  project: studentcup-2025
  mode: online  # online | offline | disabled

# Weaveトレース設定
weave:
  enabled: true
  trace_embeddings: true
  trace_retrieval: true
  trace_predictions: true
  trace_reranking: true

# ダッシュボード設定
dashboard:
  error_analysis: true
  embedding_viz: false  # Computationally expensive, disabled by default
  distribution_plots: true

# Artifacts設定
artifacts:
  log_faiss_index: true
  log_datasets: true
  log_submissions: true
  log_evaluations: true

# 検索設定
retrieval:
  top_k: 10
  faiss_index_type: IndexFlatIP

# 評価設定
evaluation:
  metrics:
    - accuracy
    - hit_rate
    - mrr
    - ndcg
  k_values:
    - 1
    - 5
    - 10
    - 20

# データ設定
data:
  base_stories_path: data/raw/base_stories.tsv
  fiction_stories_practice_path: data/raw/fiction_stories_practice.tsv
  fiction_stories_test_path: data/raw/fiction_stories_test.tsv

# 出力設定
output:
  submission_dir: data/processed
  interim_dir: data/interim

# Sweeps設定
sweeps:
  max_trials: 100
  optimization_metric: accuracy

# Reranking設定
reranking:
  enabled: true
  model: "cl-nagoya/ruri-reranker-large"  # or "ruri-small" for speed
  retrieval_k: 20  # Candidates to retrieve for reranking (sweep: 10, 20, 30, 50)
  batch_size: 32
  device: "cpu"  # or "cuda" if available

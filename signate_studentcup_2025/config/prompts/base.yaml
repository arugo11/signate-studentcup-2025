name: "baseline"
version: "1.0"
description: "ベースラインプロンプト - シンプルな指示"

system_message: |
  あなたは映画・アニメ・漫画の専門家です。あらすじから元ネタ作品を特定するのが得意です。

user_template: |
  以下は映画・アニメ・漫画のあらすじです。このあらすじは、2つの既存作品の世界観やテーマを組み合わせて作られています。

  ## 作品リスト
  {works_list}

  ## 問題のあらすじ
  {query_text}

  ## タスク
  このあらすじの元ネタとなった2作品のIDを特定してください。

  ## 出力形式
  以下のJSON形式で出力してください：
  {{
    "work_a_id": 1,
    "work_b_id": 2
  }}

variables:
  - name: "works_list"
    description: "全作品のIDとタイトルのリスト"
  - name: "query_text"
    description: "問題の混ぜ合わせたあらすじ"

# OpenRouter APIのパラメータ
api_params:
  response_format:
    type: "json_object"
  temperature: 0.7
  max_tokens: 512

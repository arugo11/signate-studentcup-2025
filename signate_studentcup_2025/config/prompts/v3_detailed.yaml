name: "v3_detailed"
version: "1.0"
description: "詳細指示プロンプト - カテゴリと要素の分析を重視"

system_message: |
  あなたは映画・アニメ・漫画の専門家です。あらすじを複数の観点から分析し、元ネタ作品を特定するのが得意です。
  ジャンル、テーマ、設定、キャラクター、ストーリー展開などの要素を考慮してください。

user_template: |
  以下は映画・アニメ・漫画のあらすじです。このあらすじは、2つの既存作品の世界観やテーマを組み合わせて作られています。

  ## 作品リスト（カテゴリ付き）
  {works_list_with_category}

  ## 問題のあらすじ
  {query_text}

  ## 分析手順
  以下の観点から分析してください：

  1. **カテゴリの特定**: アニメ/漫画/映画のどのカテゴリーか
  2. **ジャンルの特定**: SF、ファンタジー、恋愛、アクション、ミステリーなど
  3. **キーワード抽出**: 固有名詞、独特な用語、設定など
  4. **ストーリー要素**: ターンポイント、クライマックス、結末の傾向
  5. **作品の特定**: 上記の分析から、最も関連性が高い2作品を選定

  ## 出力形式
  以下のJSON形式で出力してください：
  {{
    "work_a_id": 1,
    "work_b_id": 2,
    "analysis": {{
      "category": "特定したカテゴリ",
      "genres": ["ジャンル1", "ジャンル2"],
      "keywords": ["キーワード1", "キーワード2"],
      "reasoning": "選定の根拠"
    }}
  }}

variables:
  - name: "works_list_with_category"
    description: "全作品のID、タイトル、カテゴリのリスト"
  - name: "query_text"
    description: "問題の混ぜ合わせたあらすじ"

api_params:
  response_format:
    type: "json_object"
  temperature: 0.6
  max_tokens: 1024

name: "v2_fewshot"
version: "1.0"
description: "Few-shotプロンプト - 例題を含める"

system_message: |
  あなたは映画・アニメ・漫画の専門家です。あらすじから元ネタ作品を特定するのが得意です。
  例題を参考にして、同じ形式で回答してください。

user_template: |
  以下は映画・アニメ・漫画のあらすじです。このあらすじは、2つの既存作品の世界観やテーマを組み合わせて作られています。

  ## 作品リスト
  {works_list}

  ## 例題

  ### 例題1
  あらすじ:
  「若者が広大な海を旅する冒険の物語。主人公は海賊王を目指し、仲間たちと共に謎の秘宝を探し求める。
   一方で、産業革命期のロンドンを舞台に、孤児が巨大な煙突の中で奇妙な冒険を繰り広げる。」

  回答:
  {{
    "work_a_id": 1,
    "work_b_id": 5
  }}

  解説:
  - 海賊の冒険 → 作品ID 1（海を舞台にした冒険）
  - 煙突の中の孤児の冒険 → 作品ID 5（異世界ファンタジー）

  ### 例題2
  あらすじ:
  「女子高生が恋人を探してタイムスリップする物語。過去を変えようと尽力するが、運命は残酷な結末を迎える。
   並行して、プロ棋士の世界で天才少年が最強の称号を目指す姿を描く。」

  回答:
  {{
    "work_a_id": 12,
    "work_b_id": 23
  }}

  ## 問題
  あらすじ:
  {query_text}

  ## 回答
  例題と同じ形式で回答してください：

variables:
  - name: "works_list"
    description: "全作品のIDとタイトルのリスト"
  - name: "query_text"
    description: "問題の混ぜ合わせたあらすじ"

api_params:
  response_format:
    type: "json_object"
  temperature: 0.5
  max_tokens: 512
